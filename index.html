<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FX Freeplay</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('fx_theme_mode') || 'dark';
          var custom = null;
          try {
            var raw = localStorage.getItem('fx_custom_theme');
            if (raw) custom = JSON.parse(raw);
          } catch(e){}
          
          var themes = {
            dark: { bgApp: '#131722', bgSlot: '#181b26', bgSurface: '#1e222d', bgSurfaceElevated: '#2a2e39', bgModal: '#1e222d', bgOverlay: 'rgba(0,0,0,0.65)', textPrimary: '#ffffff', textSecondary: '#b2b5be', textMuted: '#6b7280', textInverse: '#ffffff', borderDefault: '#2a2e39', borderSubdued: '#363a45', borderFocus: '#6366f1', accentPrimary: '#6366f1', accentHover: '#4f46e5', accentMuted: 'rgba(99,102,241,0.15)', surfaceHover: '#2a2e39', surfaceActive: '#363a45', statusSuccess: '#089981', statusError: '#F23645', statusWarning: '#FF6D00', statusInfo: '#2962FF' },
            amoled: { bgApp: '#000000', bgSlot: '#000000', bgSurface: '#0a0a0a', bgSurfaceElevated: '#171717', bgModal: '#0a0a0a', bgOverlay: 'rgba(0,0,0,0.85)', textPrimary: '#ffffff', textSecondary: '#a3a3a3', textMuted: '#525252', textInverse: '#ffffff', borderDefault: '#262626', borderSubdued: '#171717', borderFocus: '#3b82f6', accentPrimary: '#3b82f6', accentHover: '#2563eb', accentMuted: 'rgba(59,130,246,0.15)', surfaceHover: '#171717', surfaceActive: '#262626', statusSuccess: '#10b981', statusError: '#ef4444', statusWarning: '#f59e0b', statusInfo: '#3b82f6' },
            light: { bgApp: '#f8fafc', bgSlot: '#ffffff', bgSurface: '#ffffff', bgSurfaceElevated: '#f1f5f9', bgModal: '#ffffff', bgOverlay: 'rgba(15,23,42,0.4)', textPrimary: '#0f172a', textSecondary: '#475569', textMuted: '#94a3b8', textInverse: '#ffffff', borderDefault: '#e2e8f0', borderSubdued: '#f1f5f9', borderFocus: '#2563eb', accentPrimary: '#2563eb', accentHover: '#1d4ed8', accentMuted: 'rgba(37,99,235,0.1)', surfaceHover: '#f1f5f9', surfaceActive: '#e2e8f0', statusSuccess: '#10b981', statusError: '#ef4444', statusWarning: '#f59e0b', statusInfo: '#2563eb' }
          };
          
          var t = themes[mode];
          if (mode === 'custom' && custom) {
            t = {
              bgApp: custom.bgApp || '#131722', bgSlot: custom.bgApp || '#131722', bgSurface: custom.bgSurface || '#1e222d', bgSurfaceElevated: custom.bgSurfaceElevated || '#2a2e39', bgModal: custom.bgModal || '#1e222d', bgOverlay: 'rgba(0,0,0,0.75)', textPrimary: custom.textPrimary || '#ffffff', textSecondary: custom.textSecondary || '#b2b5be', textMuted: custom.textMuted || '#6b7280', textInverse: '#ffffff', borderDefault: custom.borderDefault || '#2a2e39', borderSubdued: custom.borderDefault || '#2a2e39', borderFocus: custom.accentPrimary || '#6366f1', accentPrimary: custom.accentPrimary || '#6366f1', accentHover: custom.accentPrimary || '#6366f1', accentMuted: 'rgba(99,102,241,0.18)', surfaceHover: custom.bgSurfaceElevated || '#2a2e39', surfaceActive: custom.bgSurfaceElevated || '#2a2e39', statusSuccess: custom.statusSuccess || '#089981', statusError: custom.statusError || '#F23645', statusWarning: custom.statusWarning || '#FF6D00', statusInfo: custom.accentPrimary || '#6366f1'
            };
          }
          if (!t) t = themes.dark;
          var root = document.documentElement;
          root.style.setProperty('--bg-app', t.bgApp);
          root.style.setProperty('--bg-slot', t.bgSlot);
          root.style.setProperty('--bg-surface', t.bgSurface);
          root.style.setProperty('--bg-surface-elevated', t.bgSurfaceElevated);
          root.style.setProperty('--bg-modal', t.bgModal);
          root.style.setProperty('--bg-overlay', t.bgOverlay);
          root.style.setProperty('--text-primary', t.textPrimary);
          root.style.setProperty('--text-secondary', t.textSecondary);
          root.style.setProperty('--text-muted', t.textMuted);
          root.style.setProperty('--text-inverse', t.textInverse);
          root.style.setProperty('--border-default', t.borderDefault);
          root.style.setProperty('--border-subdued', t.borderSubdued);
          root.style.setProperty('--border-focus', t.borderFocus);
          root.style.setProperty('--accent-primary', t.accentPrimary);
          root.style.setProperty('--accent-hover', t.accentHover);
          root.style.setProperty('--accent-muted', t.accentMuted);
          root.style.setProperty('--surface-hover', t.surfaceHover);
          root.style.setProperty('--surface-active', t.surfaceActive);
          root.style.setProperty('--status-success', t.statusSuccess);
          root.style.setProperty('--status-error', t.statusError);
          root.style.setProperty('--status-warning', t.statusWarning);
          root.style.setProperty('--status-info', t.statusInfo);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
